[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-cloud-removal"
version = "0.1.0"
description = "Real-Time Satellite Cloud Removal Pipeline for Sentinel-2 Optical + Sentinel-1 SAR Imagery"
authors = [{ name = "Earth Observation AI Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "pyyaml>=6.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0"
]
